---
# General
docker_dir: "/home/{{ ansible_user }}/docker"
backup_dir: "/home/{{ ansible_user }}/backups"
backup_retention_days: 5

# Tailscale
# Replace with your own tailnet hostname, e.g. myhost.tailxxxxx.ts.net
tailscale_hostname: "your-hostname.your-tailnet.ts.net"

# Vaultwarden
