[homeserver]
sf2 ansible_connection=local ansible_user=your_username
[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = True
; If managing over Tailscale instead of local LAN, use the Tailscale
; IP/hostname instead:
; surface2 ansible_host=your-hostname.your-tailnet.ts.net ansible_user=your_username
