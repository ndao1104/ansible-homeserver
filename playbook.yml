---

- name: Configure home server
  hosts: homeservers
  become: true
  vars_files:
    - "{{ lookup('env', 'HOME') }}/secrets/vault.yml"

  tasks:
    # ---------------------------------------------------------------
    # 1. Power management — keep running when lid is closed
    # ---------------------------------------------------------------
    - name: Ignore lid switch events (AC and battery)
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "^#?HandleLidSwitch="
        line: "HandleLidSwitch=ignore"
      notify: Restart systemd-logind

    - name: Ignore lid switch events (external power)
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "^#?HandleLidSwitchExternalPower="
        line: "HandleLidSwitchExternalPower=ignore"
      notify: Restart systemd-logind

    - name: Ignore lid switch events (docked)
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "^#?HandleLidSwitchDocked="
        line: "HandleLidSwitchDocked=ignore"
      notify: Restart systemd-logind

    # ---------------------------------------------------------------
    # 2. Docker installation
    # ---------------------------------------------------------------
    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{  lookup('env', 'HOME' }}"
        groups: docker
        append: true

    # ---------------------------------------------------------------
    # 3. Free up port 53 for AdGuard (disable systemd-resolved stub)
    # ---------------------------------------------------------------
    - name: Disable systemd-resolved DNS stub listener
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: "^#?DNSStubListener="
        line: "DNSStubListener=no"
      notify: Restart systemd-resolved

    - name: Point /etc/resolv.conf to the real resolver file
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

    # ---------------------------------------------------------------
    # 4. Deploy the Docker stack
    # ---------------------------------------------------------------
    - name: Create docker project directory
      ansible.builtin.file:
        path: "{{ docker_dir }}"
        state: directory
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0755"

    - name: Create data/cert subdirectories
      ansible.builtin.file:
        path: "{{ docker_dir }}/{{ item }}"
        state: directory
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0755"
      loop:
        - vaultwarden-data
        - caddy-data
        - certs
        - adguard-work
        - adguard-conf
        - paperless-data
        - paperless-media
        - paperless-export
        - paperless-consume
        - paperless-db
        - paperless-redis
        # - prometheus-data
        # - grafana-data
        - beszel-data
        - beszel-socket
        - beszel-agent-data
        # - nextcloud-data
        # - nextcloud-db
        # - nextcloud-redis
        - uptime-kuma-data
        - opencloud-config
        - opencloud-data

    - name: Set ownership for OpenCloud directories
      ansible.builtin.file:
        path: "{{ docker_dir }}/{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - opencloud-config
        - opencloud-data

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ docker_dir }}/docker-compose.yml"
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0644"

    - name: Deploy Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ docker_dir }}/Caddyfile"
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0644"

    # - name: Deploy Prometheus config
    #   ansible.builtin.template:
    #     src: prometheus.yml.j2
    #     dest: "{{ docker_dir }}/prometheus.yml"
    #     owner: "{{  lookup('env', 'HOME' }}"
    #     mode: "0644"

    # NOTE: Tailscale certs (surface2/.key) must be
    # generated manually first with `tailscale cert <hostname>` and placed
    # in {{ docker_dir }}/certs/ — Ansible can copy them into place but
    # cannot generate them, since that requires an authenticated tailnet
    # session on the host itself.

    - name: Start the Docker stack
      community.docker.docker_compose_v2:
        project_src: "{{ docker_dir }}"
        state: present

    # ---------------------------------------------------------------
    # 5. Backup automation
    # ---------------------------------------------------------------
    - name: Create backups directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0755"

    - name: Deploy backup script
      ansible.builtin.template:
        src: backup-vaultwarden.sh.j2
        dest: "/home/{{  lookup('env', 'HOME' }}/backup-vaultwarden.sh"
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0755"

    - name: Schedule nightly Vaultwarden backup
      ansible.builtin.cron:
        name: "Vaultwarden backup"
        minute: "0"
        hour: "2"
        user: "{{  lookup('env', 'HOME' }}"
        job: "/home/{{  lookup('env', 'HOME' }}/backup-vaultwarden.sh >> {{ backup_dir }}/backup.log 2>&1"

    - name: Deploy Paperless backup script
      ansible.builtin.template:
        src: backup-paperless.sh.j2
        dest: "/home/{{  lookup('env', 'HOME' }}/backup-paperless.sh"
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0755"

    - name: Schedule nightly Paperless backup
      ansible.builtin.cron:
        name: "Paperless backup"
        minute: "30"
        hour: "2"
        user: "{{  lookup('env', 'HOME' }}"
        job: "/home/{{  lookup('env', 'HOME' }}/backup-paperless.sh >> {{ backup_dir }}/backup.log 2>&1"
    
    # - name: Deploy Nextcloud backup script
    #   ansible.builtin.template:
    #     src: backup-nextcloud.sh.j2
    #     dest: "/home/{{  lookup('env', 'HOME' }}/backup-nextcloud.sh"
    #     owner: "{{  lookup('env', 'HOME' }}"
    #     mode: "0755"

    # - name: Schedule nightly Nextcloud backup
    #   ansible.builtin.cron:
    #     name: "Nextcloud backup"
    #     minute: "0"
    #     hour: "3"
    #     user: "{{  lookup('env', 'HOME' }}"
    #     job: "/home/{{  lookup('env', 'HOME' }}/backup-nextcloud.sh >> {{ backup_dir }}/backup.log 2>&1"

    - name: Deploy OpenCloud backup script
      ansible.builtin.template:
        src: backup-opencloud.sh.j2
        dest: "/home/{{  lookup('env', 'HOME' }}/backup-opencloud.sh"
        owner: "{{  lookup('env', 'HOME' }}"
        mode: "0755"

    - name: Schedule nightly OpenCloud backup
      ansible.builtin.cron:
        name: "OpenCloud backup"
        minute: "30"
        hour: "3"
        user: "{{  lookup('env', 'HOME' }}"
        job: "/home/{{  lookup('env', 'HOME' }}/backup-opencloud.sh >> {{ backup_dir }}/backup.log 2>&1"

  handlers:
    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted

      
